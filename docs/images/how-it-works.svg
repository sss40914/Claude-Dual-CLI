<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">One machine, two Claude Code profiles</text>
  <text x="440" y="60" text-anchor="middle" font-size="13" fill="#6b7280">CLAUDE_CONFIG_DIR is set per process, so each window reads its own folder</text>

  <!-- Window A -->
  <rect x="60" y="90" width="320" height="130" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <rect x="60" y="90" width="320" height="28" rx="10" fill="#e5e7eb"/>
  <circle cx="78" cy="104" r="5" fill="#ef4444"/><circle cx="94" cy="104" r="5" fill="#f59e0b"/><circle cx="110" cy="104" r="5" fill="#10b981"/>
  <text x="220" y="109" text-anchor="middle" font-size="13" fill="#374151">Terminal A (your usual terminal)</text>
  <text x="80" y="150" font-family="Consolas, monospace" font-size="13" fill="#111827">&gt; claude</text>
  <text x="80" y="176" font-family="Consolas, monospace" font-size="12" fill="#6b7280">CLAUDE_CONFIG_DIR: (not set)</text>
  <text x="80" y="198" font-family="Consolas, monospace" font-size="12" fill="#6b7280">uses the default folder</text>

  <!-- Window B -->
  <rect x="500" y="90" width="320" height="130" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="500" y="90" width="320" height="28" rx="10" fill="#e0e7ff"/>
  <circle cx="518" cy="104" r="5" fill="#ef4444"/><circle cx="534" cy="104" r="5" fill="#f59e0b"/><circle cx="550" cy="104" r="5" fill="#10b981"/>
  <text x="660" y="109" text-anchor="middle" font-size="13" fill="#3730a3">Terminal B (opened by the script)</text>
  <text x="520" y="150" font-family="Consolas, monospace" font-size="13" fill="#111827">&gt; claude</text>
  <text x="520" y="176" font-family="Consolas, monospace" font-size="12" fill="#4338ca">CLAUDE_CONFIG_DIR=~\.claude-secondary</text>
  <text x="520" y="198" font-family="Consolas, monospace" font-size="12" fill="#6b7280">set only inside this window</text>

  <!-- arrows -->
  <line x1="220" y1="220" x2="220" y2="285" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="220" x2="660" y2="285" stroke="#6366f1" stroke-width="2" marker-end="url(#b)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>

  <!-- folders -->
  <rect x="80" y="290" width="280" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="220" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">~\.claude</text>
  <text x="220" y="342" text-anchor="middle" font-size="12" fill="#6b7280">account A sign-in, user settings,</text>
  <text x="220" y="360" text-anchor="middle" font-size="12" fill="#6b7280">history</text>

  <rect x="520" y="290" width="280" height="96" rx="8" fill="#ffffff" stroke="#6366f1" stroke-dasharray="4 3"/>
  <text x="660" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#111827">~\.claude-secondary</text>
  <text x="660" y="342" text-anchor="middle" font-size="12" fill="#6b7280">account B sign-in, user settings,</text>
  <text x="660" y="360" text-anchor="middle" font-size="12" fill="#6b7280">history</text>

  <text x="440" y="408" text-anchor="middle" font-size="12" fill="#9ca3af">Nothing is shared between the two folders</text>
</svg>
