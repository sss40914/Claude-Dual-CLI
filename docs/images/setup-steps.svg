<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="230" fill="#ffffff"/>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>

  <rect x="30" y="40" width="240" height="150" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <circle cx="60" cy="72" r="16" fill="#111827"/><text x="60" y="77" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">1</text>
  <text x="86" y="78" font-size="15" font-weight="600" fill="#111827">Create the profile</text>
  <text x="50" y="114" font-family="Consolas, monospace" font-size="12" fill="#374151">Setup-ClaudeProfile.ps1</text>
  <text x="50" y="140" font-size="12" fill="#6b7280">Makes ~\.claude-secondary</text>
  <text x="50" y="160" font-size="12" fill="#6b7280">and signs in once</text>

  <line x1="275" y1="115" x2="320" y2="115" stroke="#6b7280" stroke-width="2" marker-end="url(#m)"/>

  <rect x="325" y="40" width="240" height="150" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <circle cx="355" cy="72" r="16" fill="#111827"/><text x="355" y="77" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">2</text>
  <text x="381" y="78" font-size="15" font-weight="600" fill="#111827">Open it</text>
  <text x="345" y="114" font-family="Consolas, monospace" font-size="12" fill="#374151">Start-ClaudeProfile.ps1</text>
  <text x="345" y="140" font-size="12" fill="#6b7280">New window titled</text>
  <text x="345" y="160" font-family="Consolas, monospace" font-size="12" fill="#6b7280">Claude Code [secondary]</text>

  <line x1="570" y1="115" x2="615" y2="115" stroke="#6b7280" stroke-width="2" marker-end="url(#m)"/>

  <rect x="620" y="40" width="230" height="150" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <circle cx="650" cy="72" r="16" fill="#111827"/><text x="650" y="77" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">3</text>
  <text x="676" y="78" font-size="15" font-weight="600" fill="#111827">Work side by side</text>
  <text x="640" y="114" font-size="12" fill="#6b7280">Your usual terminal keeps</text>
  <text x="640" y="134" font-size="12" fill="#6b7280">the default profile; the new</text>
  <text x="640" y="154" font-size="12" fill="#6b7280">window uses the second one</text>

  <text x="440" y="218" text-anchor="middle" font-size="12" fill="#9ca3af">Step 1 is needed once per profile. Step 2 any time you want that profile.</text>
</svg>
